[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatos-local"
version = "0.2.0"
description = "A visible local workspace for AI conversations and useful context"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
chatos = "chatos.__main__:main"

[project.optional-dependencies]
terminal = ["rich>=13,<15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatos = ["static/*", "templates/*"]

[tool.ruff]
target-version = "py39"

[tool.basedpyright]
include = ["src/chatos/workspace.py", "src/chatos/setup.py", "src/chatos/context.py"]
pythonVersion = "3.9"
typeCheckingMode = "basic"
